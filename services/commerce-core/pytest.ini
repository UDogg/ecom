[pytest]
# Deprecations fail the suite, so a dependency bump that deprecates something we use is caught
# in its own pull request. Silence a warning raised inside a library with a targeted ignore below.
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py
testpaths = tests
addopts = -q -p no:cacheprovider
filterwarnings =
    error::DeprecationWarning
    error::PendingDeprecationWarning
